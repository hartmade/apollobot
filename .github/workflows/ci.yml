name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: apollobot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --frozen --extra dev
      - name: Run test suite
        run: uv run pytest -q

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --frozen --extra dev
      - name: Lint production service boundary
        run: >-
          uv run ruff check
          src/apollobot/compute
          src/apollobot/mcp/__init__.py
          src/apollobot/mcp/servers/builtin.py
          src/apollobot/service
          src/apollobot/core/__init__.py
          tests/test_config.py
          tests/test_mcp_client.py
          tests/test_sandbox.py
          tests/test_service.py
      - name: Check formatting
        run: >-
          uv run ruff format --check
          src/apollobot/compute
          src/apollobot/mcp/__init__.py
          src/apollobot/mcp/servers/builtin.py
          src/apollobot/service
          src/apollobot/core/__init__.py
          tests/test_config.py
          tests/test_mcp_client.py
          tests/test_sandbox.py
          tests/test_service.py
      - name: Check sandbox dependency lock
        run: |
          uv pip compile deploy/sandbox/requirements.in \
            --generate-hashes --universal \
            --output-file /tmp/apollobot-sandbox-requirements.lock
          diff -u deploy/sandbox/requirements.lock /tmp/apollobot-sandbox-requirements.lock

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment manifest
        env:
          APOLLOBOT_DATA_DIR: /srv/frontier-science/apollobot
          APOLLOBOT_RELEASE_SHA: ${{ github.sha }}
          APOLLOBOT_SERVICE_IMAGE: frontier-science/apollobot-service:ci-${{ github.sha }}
          APOLLOBOT_SANDBOX_IMAGE: frontier-science/apollobot-sandbox:ci-${{ github.sha }}
          DOCKER_GID: "999"
          APOLLOBOT_SERVICE_TOKEN: ci-service-token-00000000000000000000000000000000
          APOLLOBOT_WEBHOOK_SECRET: ci-webhook-secret-0000000000000000000000000000000
          FRONTIER_PLATFORM_URL: https://frontier.invalid
        run: docker compose -f deploy/docker-compose.yml config --quiet
      - name: Build analysis sandbox
        run: docker build --build-arg APOLLOBOT_RELEASE_SHA=${{ github.sha }} -f deploy/sandbox/Dockerfile -t frontier-science/apollobot-sandbox:ci .
      - name: Build service worker
        run: docker build --build-arg APOLLOBOT_RELEASE_SHA=${{ github.sha }} -f deploy/service/Dockerfile -t frontier-science/apollobot-service:ci .
      - name: Verify immutable image revision labels
        run: |
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' frontier-science/apollobot-sandbox:ci)" = "${{ github.sha }}"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' frontier-science/apollobot-service:ci)" = "${{ github.sha }}"
